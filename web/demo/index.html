<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12100e">
  <title>VESTA: 29-second demo</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg-0); color: var(--ivory); font-family: var(--font); }
    main { width: min(100% - 40px, 1200px); margin: 0 auto; padding: 48px 0; }
    h1 { margin: 24px 0; font-size: clamp(26px, 4vw, 44px); font-weight: 500; line-height: 1.15; }
    a { color: var(--rust-text); text-underline-offset: 4px; }
    a:focus-visible { outline: 2px solid var(--amber); outline-offset: 6px; }
    video { display: block; width: 100%; aspect-ratio: 16 / 9; background: var(--bg-1); border: 1px solid var(--line); border-radius: var(--r-card); }
    p { max-width: 72ch; color: var(--ivory-dim); font-size: 16px; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <a href="../">Back to the app</a>
    <h1>VESTA: 29-second demo</h1>
    <video controls playsinline preload="metadata" aria-label="VESTA: 29-second demo">
      <source src="vesta-demo.mp4" type="video/mp4">
      Your browser does not support embedded video. <a href="vesta-demo.mp4">Download the demo</a>.
    </video>
    <p>Visuals generated with SI assistance are marked in the video. The screens shown are the real app.</p>
  </main>
</body>
</html>
